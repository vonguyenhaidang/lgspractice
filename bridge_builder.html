<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPAN — Bridge Engineering Trials</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0c2338;
    --navy:#123553;
    --navy-light:#1c4a6e;
    --cyan:#5fd4ff;
    --cyan-dim:#2d6b8f;
    --cyan-faint:#1e4a68;
    --paper:#e8f3fa;
    --ink:#dbeefb;
    --orange:#ff7a45;
    --orange-dim:#a4491f;
    --green:#5fe3a0;
    --red:#ff5f6d;
    --wood:#b9814f;
    --wood-dark:#6e4a28;
    --steel:#d7e2e8;
    --steel-dark:#7f939e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--navy-deep);
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    width:100%;
    max-width:960px;
    padding:16px;
  }
  .titleblock{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--cyan-dim);
    padding-bottom:10px; margin-bottom:12px;
    flex-wrap:wrap; gap:6px;
  }
  .titleblock h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:2px;
    margin:0;
    color:var(--paper);
  }
  .titleblock h1 span{ color:var(--orange); }
  .titleblock .sub{
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--cyan);
    text-transform:uppercase;
  }
  #stage{
    position:relative;
    border:2px solid var(--cyan-dim);
    background:var(--navy-deep);
    box-shadow: 0 0 0 1px rgba(95,212,255,0.08), 0 20px 60px rgba(0,0,0,0.5);
  }
  canvas{ display:block; width:100%; height:auto; cursor:crosshair; touch-action:none; }

  #hud{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px;
    background:var(--navy);
    border-bottom:1px solid var(--cyan-faint);
    flex-wrap:wrap; gap:10px;
  }
  .stamp{
    display:flex; flex-direction:column; gap:2px;
  }
  .stamp .lvl{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:15px; color:var(--paper); letter-spacing:0.5px;
  }
  .stamp .hint{ font-size:11px; color:var(--cyan); max-width:440px; line-height:1.5;}
  .budget{
    text-align:right; font-size:13px;
  }
  .budget .label{ font-size:10px; letter-spacing:1.5px; color:var(--cyan-dim); text-transform:uppercase;}
  .budget .amt{ font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:600; color:var(--green);}
  .budget .amt.low{ color:var(--red); }

  #toolbar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:10px 14px;
    background:var(--navy);
    border-top:1px solid var(--cyan-faint);
  }
  .grp{ display:flex; gap:6px; align-items:center; padding-right:10px; border-right:1px solid var(--cyan-faint); }
  .grp:last-child{ border-right:none; }
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; font-weight:600; letter-spacing:0.4px;
    background:var(--navy-light);
    color:var(--ink);
    border:1px solid var(--cyan-dim);
    padding:8px 11px;
    cursor:pointer;
    border-radius:2px;
    transition:all .12s ease;
    white-space:nowrap;
  }
  button:hover{ background:var(--cyan-faint); border-color:var(--cyan); }
  button.active{ background:var(--cyan); color:var(--navy-deep); border-color:var(--cyan); }
  button.build{ background:var(--orange-dim); border-color:var(--orange); color:var(--paper); font-weight:700; }
  button.build:hover{ background:var(--orange); }
  button:disabled{ opacity:0.35; cursor:not-allowed; }
  button.mat-wood{ border-color:var(--wood); }
  button.mat-wood.active{ background:var(--wood); color:#2a1a0c; }
  button.mat-steel{ border-color:var(--steel-dark); }
  button.mat-steel.active{ background:var(--steel); color:#1a2226; }

  .swatch{ width:9px; height:9px; display:inline-block; border-radius:50%; margin-right:5px; vertical-align:middle;}

  #overlay{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(9,22,36,0.86);
    backdrop-filter: blur(1px);
  }
  #overlay .panel{
    background:var(--navy);
    border:2px solid var(--cyan);
    padding:26px 34px;
    text-align:center;
    max-width:80%;
  }
  #overlay h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:24px; margin:0 0 8px 0; letter-spacing:1px;
  }
  #overlay h2.win{ color:var(--green); }
  #overlay h2.lose{ color:var(--red); }
  #overlay p{ font-size:12.5px; color:var(--cyan); line-height:1.6; margin:0 0 16px 0;}
  #overlay .row{ display:flex; gap:10px; justify-content:center; }

  #levelPips{ display:flex; gap:5px; align-items:center; margin-left:14px; }
  .pip{
    width:9px; height:9px; border-radius:50%;
    background:var(--navy-light); border:1px solid var(--cyan-dim);
  }
  .pip.done{ background:var(--green); border-color:var(--green); }
  .pip.cur{ background:var(--orange); border-color:var(--orange); }

  .flash{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:var(--red); color:#fff; font-size:11px; font-weight:700;
    padding:6px 14px; border-radius:2px; letter-spacing:0.5px;
    opacity:0; pointer-events:none; transition:opacity .15s ease;
  }
  .flash.show{ opacity:1; }

  footer{
    font-size:10.5px; color:var(--cyan-dim); text-align:center; margin-top:10px; letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="titleblock">
    <h1>SPAN<span>::</span>ENGINEERING TRIALS</h1>
    <div class="sub" id="levelCounter">LEVEL 1 / 5</div>
  </div>

  <div id="stage">
    <div id="hud">
      <div class="stamp">
        <div class="lvl" id="lvlName">Level 1 — First Crossing</div>
        <div class="hint" id="lvlHint">Span the gap with a simple deck.</div>
      </div>
      <div style="display:flex; align-items:center;">
        <div class="budget">
          <div class="label">Budget Remaining</div>
          <div class="amt" id="budgetAmt">$400</div>
        </div>
        <div id="levelPips"></div>
      </div>
    </div>

    <canvas id="canvas" width="900" height="500"></canvas>
    <div class="flash" id="flash"></div>

    <div id="overlay">
      <div class="panel">
        <h2 id="overlayTitle"></h2>
        <p id="overlayText"></p>
        <div class="row" id="overlayButtons"></div>
      </div>
    </div>

    <div id="toolbar">
      <div class="grp">
        <button id="toolDeck" class="active"><span class="swatch" style="background:var(--orange)"></span>Deck Joint · $20</button>
        <button id="toolSupport"><span class="swatch" style="background:#9fb4c2"></span>Support Joint · $10</button>
      </div>
      <div class="grp">
        <button id="toolBeam"><span class="swatch" style="background:var(--cyan)"></span>Beam</button>
        <button id="matWood" class="mat-wood active">Wood</button>
        <button id="matSteel" class="mat-steel">Steel</button>
      </div>
      <div class="grp">
        <button id="toolDelete"><span class="swatch" style="background:var(--red)"></span>Delete</button>
        <button id="clearAll">Clear All</button>
      </div>
      <div class="grp" style="border-right:none;">
        <button id="resetBtn">Reset Build</button>
        <button id="buildBtn" class="build">▶ Simulate</button>
      </div>
    </div>
  </div>
  <footer>Place joints, connect them with beams, then simulate. Beams snap if overstretched — brace your truss. Steel is stronger but costs more per meter.</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- Canvas / constants ----------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND_H = 500;
  const GRAVITY = 1500;
  const DAMPING = 0.996;
  const ITER = 12;
  const VEHICLE_SPEED = 72;
  const WEIGHT_FACTOR = 0.85;

  const MATERIAL = {
    wood:  { costPerPx: 0.11, breakStretch: 0.15, color: '#b9814f', dark:'#6e4a28', width:5 },
    steel: { costPerPx: 0.30, breakStretch: 0.32, color: '#d7e2e8', dark:'#7f939e', width:7 }
  };
  const NODE_COST = { deck: 20, support: 10 };

  // ---------- Levels ----------
  const levels = [
    { name:"Level 1 — First Crossing", gapWidth:220, budget:380, vMass:1.0, deckY:330, island:null,
      hint:"A short gap. One braced beam should do it — try a support joint below the deck for a triangle." },
    { name:"Level 2 — Wider Span", gapWidth:330, budget:520, vMass:1.1, deckY:330, island:null,
      hint:"Too wide for a single beam. Add deck joints in the middle and triangulate above or below." },
    { name:"Level 3 — Heavy Load", gapWidth:350, budget:600, vMass:1.7, deckY:330, island:null,
      hint:"A heavier truck this time. Wood may snap under the load — reinforce with steel where it matters." },
    { name:"Level 4 — The Pillar", gapWidth:480, budget:680, vMass:1.4, deckY:330, island:{x:390,y:430},
      hint:"A rock pillar rises from the chasm floor. Anchor cables to it to support the span." },
    { name:"Level 5 — Grand Canyon", gapWidth:600, budget:820, vMass:1.8, deckY:330, island:{x:460,y:445},
      hint:"The final crossing. Budget is tight — build an efficient truss and spend steel wisely." }
  ];

  const LEFT_X = 150;
  const RIGHT_EDGE = 900;

  // ---------- State ----------
  let state = {
    levelIndex: 0,
    nodes: [],      // {x,y,px,py,pinned,isDeck,id}
    edges: [],      // {a,b,rest,material,broken}
    spent: 0,
    tool: 'deck',
    material: 'wood',
    pendingNode: null, // for beam tool: first selected node
    simulating: false,
    won: false,
    gameOver: false,
    vehicle: null,
    breakFx: [],
    completed: [false,false,false,false,false],
    preSim: null
  };

  let nodeId = 0;
  function mkNode(x,y,pinned,isDeck){
    return { id: nodeId++, x, y, px:x, py:y, pinned, isDeck };
  }

  function level(){ return levels[state.levelIndex]; }
  function leftAnchorX(){ return LEFT_X; }
  function rightAnchorX(){ return LEFT_X + level().gapWidth; }

  // ---------- Level setup ----------
  function loadLevel(i){
    state.levelIndex = i;
    const lv = levels[i];
    state.nodes = [];
    state.edges = [];
    state.spent = 0;
    state.pendingNode = null;
    state.simulating = false;
    state.won = false;
    state.gameOver = false;
    state.vehicle = null;
    state.breakFx = [];
    state.preSim = null;

    const la = mkNode(leftAnchorX(), lv.deckY, true, true);
    const ra = mkNode(rightAnchorX(), lv.deckY, true, true);
    state.nodes.push(la, ra);
    state.leftAnchor = la;
    state.rightAnchor = ra;

    if(lv.island){
      const isl = mkNode(lv.island.x, lv.island.y, true, false);
      state.nodes.push(isl);
      state.island = isl;
    } else {
      state.island = null;
    }

    document.getElementById('lvlName').textContent = lv.name;
    document.getElementById('lvlHint').textContent = lv.hint;
    document.getElementById('levelCounter').textContent = `LEVEL ${i+1} / ${levels.length}`;
    updateBudgetUI();
    renderPips();
    hideOverlay();
  }

  function renderPips(){
    const el = document.getElementById('levelPips');
    el.innerHTML = '';
    levels.forEach((_,i)=>{
      const d = document.createElement('div');
      d.className = 'pip' + (state.completed[i] ? ' done' : (i===state.levelIndex ? ' cur':''));
      el.appendChild(d);
    });
  }

  function updateBudgetUI(){
    const remaining = Math.round(level().budget - state.spent);
    const el = document.getElementById('budgetAmt');
    el.textContent = '$' + remaining;
    el.classList.toggle('low', remaining < level().budget*0.15);
  }

  function flash(msg){
    const f = document.getElementById('flash');
    f.textContent = msg;
    f.classList.add('show');
    clearTimeout(flash._t);
    flash._t = setTimeout(()=>f.classList.remove('show'), 1400);
  }

  // ---------- Geometry helpers ----------
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function nodeAt(x,y,r){
    r = r||16;
    let best=null, bd=r;
    for(const n of state.nodes){
      const d = Math.hypot(n.x-x, n.y-y);
      if(d < bd){ bd = d; best = n; }
    }
    return best;
  }
  function edgeAt(x,y,r){
    r = r||7;
    let best=null, bd=r;
    for(const e of state.edges){
      if(e.broken) continue;
      const a = e.a, b = e.b;
      const d = ptSegDist(x,y,a.x,a.y,b.x,b.y);
      if(d < bd){ bd = d; best = e; }
    }
    return best;
  }
  function ptSegDist(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    let t = len2 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1+t*dx, cy = y1+t*dy;
    return Math.hypot(px-cx, py-cy);
  }

  // ---------- Build actions ----------
  function tryAddNode(x, y, isDeck){
    if(state.simulating) return;
    const cost = isDeck ? NODE_COST.deck : NODE_COST.support;
    if(state.spent + cost > level().budget){ flash('INSUFFICIENT BUDGET'); return; }
    // keep within play field
    if(x < 30 || x > 870 || y < 20 || y > 495){ return; }
    if(isDeck){
      // must sit within the gap span (roughly)
      if(x < leftAnchorX()+15 || x > rightAnchorX()-15) { flash('DECK JOINTS GO WITHIN THE SPAN'); return; }
    }
    const n = mkNode(x, y, false, isDeck);
    state.nodes.push(n);
    state.spent += cost;
    updateBudgetUI();
  }

  function tryAddEdge(n1, n2){
    if(n1 === n2) return;
    const exists = state.edges.find(e => (e.a===n1&&e.b===n2)||(e.a===n2&&e.b===n1));
    if(exists){ flash('BEAM ALREADY EXISTS'); return; }
    const mat = MATERIAL[state.material];
    const len = dist(n1,n2);
    const cost = Math.max(4, len * mat.costPerPx);
    if(state.spent + cost > level().budget){ flash('INSUFFICIENT BUDGET'); return; }
    state.edges.push({ a:n1, b:n2, rest: len, material: state.material, broken:false, cost });
    state.spent += cost;
    updateBudgetUI();
  }

  function deleteNear(x,y){
    if(state.simulating) return;
    const n = nodeAt(x,y,16);
    if(n){
      if(n.pinned){ flash("CAN'T DELETE ANCHORS"); return; }
      // remove connected edges, refund
      const connected = state.edges.filter(e => e.a===n || e.b===n);
      let refund = connected.length ? connected.reduce((s,e)=>s+e.cost,0) : 0;
      refund += n.isDeck ? NODE_COST.deck : NODE_COST.support;
      state.edges = state.edges.filter(e => !(e.a===n || e.b===n));
      state.nodes = state.nodes.filter(nn => nn!==n);
      state.spent = Math.max(0, state.spent - refund);
      updateBudgetUI();
      return;
    }
    const e = edgeAt(x,y,8);
    if(e){
      state.edges = state.edges.filter(ee=>ee!==e);
      state.spent = Math.max(0, state.spent - e.cost);
      updateBudgetUI();
    }
  }

  function clearAll(){
    if(state.simulating) return;
    state.nodes = state.nodes.filter(n => n.pinned);
    state.edges = [];
    state.spent = 0;
    state.pendingNode = null;
    updateBudgetUI();
  }

  // ---------- Simulation ----------
  function cloneBuild(){
    return {
      nodes: state.nodes.map(n=>({...n})),
      edges: state.edges.map(e=>({ aId:e.a.id, bId:e.b.id, rest:e.rest, material:e.material, broken:e.broken, cost:e.cost }))
    };
  }
  function restoreBuild(snap){
    const map = {};
    state.nodes = snap.nodes.map(n=>{ const c={...n}; map[c.id]=c; return c; });
    state.edges = snap.edges.map(e=>({ a:map[e.aId], b:map[e.bId], rest:e.rest, material:e.material, broken:e.broken, cost:e.cost }));
    state.leftAnchor = state.nodes.find(n=>n.id===state.leftAnchor.id);
    state.rightAnchor = state.nodes.find(n=>n.id===state.rightAnchor.id);
    if(state.island) state.island = state.nodes.find(n=>n.id===state.island.id);
  }

  function startSimulation(){
    if(state.nodes.length < 2) return;
    state.preSim = cloneBuild();
    state.simulating = true;
    state.won = false;
    state.gameOver = false;
    state.breakFx = [];
    state.vehicle = { x:55, y: level().deckY, vy:0, r:13, mass: level().vMass, falling:false };
    hideOverlay();
  }

  function resetBuild(){
    if(state.preSim){ restoreBuild(state.preSim); }
    state.simulating = false;
    state.won = false;
    state.gameOver = false;
    state.vehicle = null;
    state.breakFx = [];
    hideOverlay();
  }

  function physicsStep(dt){
    // integrate free nodes
    for(const n of state.nodes){
      if(n.pinned) continue;
      const vx = (n.x - n.px) * DAMPING;
      const vy = (n.y - n.py) * DAMPING;
      n.px = n.x; n.py = n.y;
      n.x += vx;
      n.y += vy + GRAVITY*dt*dt;
    }

    // constraint relaxation
    for(let it=0; it<ITER; it++){
      for(const e of state.edges){
        if(e.broken) continue;
        const a=e.a, b=e.b;
        const dx=b.x-a.x, dy=b.y-a.y;
        let d = Math.hypot(dx,dy);
        if(d < 0.0001) d = 0.0001;
        const diff = (d - e.rest) / d;
        const stretch = (d - e.rest) / e.rest;
        const mat = MATERIAL[e.material];
        if(Math.abs(stretch) > mat.breakStretch){
          e.broken = true;
          state.breakFx.push({x:(a.x+b.x)/2, y:(a.y+b.y)/2, life:0.35});
          continue;
        }
        const ox = dx*0.5*diff, oy = dy*0.5*diff;
        if(!a.pinned){ a.x += ox; a.y += oy; }
        if(!b.pinned){ b.x -= ox; b.y -= oy; }
      }
    }
    state.edges = state.edges.filter(e=>!e.broken);

    // vehicle
    const v = state.vehicle;
    if(v && !state.won && !state.gameOver){
      const la = state.leftAnchor, ra = state.rightAnchor;
      if(v.x < la.x - v.r){
        v.y = level().deckY;
        v.x += VEHICLE_SPEED*dt;
      } else if(v.x > ra.x + v.r && !v.falling){
        v.y = level().deckY;
        v.x += VEHICLE_SPEED*dt;
        if(v.x > RIGHT_EDGE - 30){
          state.won = true;
          state.simulating = false;
          onWin();
        }
      } else {
        // gap zone: find supporting deck-deck edge under vehicle x
        let support = null, bestY = -Infinity;
        for(const e of state.edges){
          if(e.broken) continue;
          if(!e.a.isDeck || !e.b.isDeck) continue;
          const x1 = Math.min(e.a.x,e.b.x), x2=Math.max(e.a.x,e.b.x);
          if(v.x >= x1-2 && v.x <= x2+2){
            const t = (x2-x1)<0.001 ? 0.5 : (v.x - x1)/(x2-x1);
            const leftNode = e.a.x<=e.b.x ? e.a : e.b;
            const rightNode = e.a.x<=e.b.x ? e.b : e.a;
            const y = leftNode.y + (rightNode.y-leftNode.y)*t;
            if(y > bestY){ bestY = y; support = {e, t: (e.a.x<=e.b.x? t : 1-t)}; }
          }
        }
        if(support){
          v.falling = false;
          v.vy = 0;
          v.y = bestY - 0;
          const e = support.e;
          const leftNode = e.a.x<=e.b.x ? e.a : e.b;
          const rightNode = e.a.x<=e.b.x ? e.b : e.a;
          const tt = support.t;
          const force = v.mass * 60 * WEIGHT_FACTOR * dt;
          if(!leftNode.pinned) leftNode.y += force*(1-tt);
          if(!rightNode.pinned) rightNode.y += force*(tt);
          v.x += VEHICLE_SPEED*dt;
        } else {
          v.falling = true;
          v.vy += GRAVITY*dt*dt;
          v.y += v.vy;
          v.x += VEHICLE_SPEED*dt*0.4;
          if(v.y > GROUND_H + 40){
            state.gameOver = true;
            state.simulating = false;
            onLose();
          }
        }
      }
    }

    for(const fx of state.breakFx) fx.life -= dt;
    state.breakFx = state.breakFx.filter(f=>f.life>0);
  }

  function onWin(){
    state.completed[state.levelIndex] = true;
    renderPips();
    showOverlay(true);
  }
  function onLose(){
    showOverlay(false);
  }

  // ---------- Overlay ----------
  function showOverlay(won){
    const ov = document.getElementById('overlay');
    ov.style.display = 'flex';
    const title = document.getElementById('overlayTitle');
    const text = document.getElementById('overlayText');
    const btns = document.getElementById('overlayButtons');
    btns.innerHTML = '';
    if(won){
      title.textContent = 'CROSSING COMPLETE';
      title.className = 'win';
      const spent = Math.round(state.spent), budget = level().budget;
      text.textContent = `The vehicle made it across. Spent $${spent} of $${budget}.`;
      if(state.levelIndex < levels.length-1){
        const b = document.createElement('button');
        b.className='build'; b.textContent='Next Level →';
        b.onclick = ()=> loadLevel(state.levelIndex+1);
        btns.appendChild(b);
      } else {
        text.textContent += ' All five crossings engineered. Well done, chief engineer.';
      }
      const r = document.createElement('button');
      r.textContent='Rebuild This Level';
      r.onclick = ()=> { resetBuild(); ov.style.display='none'; };
      btns.appendChild(r);
    } else {
      title.textContent = 'STRUCTURE FAILURE';
      title.className = 'lose';
      text.textContent = 'The bridge could not hold the load. Adjust your design and try again.';
      const r = document.createElement('button');
      r.className='build'; r.textContent='Retry';
      r.onclick = ()=> { resetBuild(); ov.style.display='none'; };
      btns.appendChild(r);
    }
  }
  function hideOverlay(){ document.getElementById('overlay').style.display = 'none'; }

  // ---------- Drawing ----------
  function drawGrid(){
    ctx.fillStyle = '#0c2338';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(95,212,255,0.06)';
    ctx.lineWidth = 1;
    for(let x=0;x<=W;x+=25){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for(let y=0;y<=H;y+=25){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // corner ticks
    ctx.strokeStyle = 'rgba(95,212,255,0.25)';
    ctx.lineWidth = 1.5;
    [[10,10],[W-10,10],[10,H-10],[W-10,H-10]].forEach(([x,y])=>{
      ctx.beginPath();
      ctx.moveTo(x-6,y); ctx.lineTo(x+6,y);
      ctx.moveTo(x,y-6); ctx.lineTo(x,y+6);
      ctx.stroke();
    });
  }

  function drawTerrain(){
    const lv = level();
    const la = leftAnchorX(), ra = rightAnchorX();
    ctx.strokeStyle = '#5fd4ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([]);
    // left platform
    ctx.beginPath();
    ctx.moveTo(0, lv.deckY);
    ctx.lineTo(la, lv.deckY);
    ctx.lineTo(la, H);
    ctx.stroke();
    // hatch fill left
    hatchFill(0, lv.deckY, la, H);
    // right platform
    ctx.beginPath();
    ctx.moveTo(ra, lv.deckY);
    ctx.lineTo(W, lv.deckY);
    ctx.lineTo(ra, H);
    ctx.stroke();
    hatchFill(ra, lv.deckY, W, H, ra);

    // chasm outline dashed
    ctx.strokeStyle = 'rgba(95,212,255,0.35)';
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(la, lv.deckY); ctx.lineTo(la, H);
    ctx.moveTo(ra, lv.deckY); ctx.lineTo(ra, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // span dimension line
    ctx.strokeStyle = 'rgba(255,122,69,0.7)';
    ctx.lineWidth = 1;
    const dimY = 40;
    ctx.beginPath();
    ctx.moveTo(la, dimY); ctx.lineTo(la, dimY+8);
    ctx.moveTo(ra, dimY); ctx.lineTo(ra, dimY+8);
    ctx.moveTo(la, dimY+4); ctx.lineTo(ra, dimY+4);
    ctx.stroke();
    ctx.fillStyle = '#ff7a45';
    ctx.font = '11px "IBM Plex Mono"';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(lv.gapWidth) + ' m SPAN', (la+ra)/2, dimY-4);

    // island / pillar
    if(lv.island){
      ctx.strokeStyle = '#5fd4ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lv.island.x-22, H);
      ctx.lineTo(lv.island.x-10, lv.island.y);
      ctx.lineTo(lv.island.x+10, lv.island.y);
      ctx.lineTo(lv.island.x+22, H);
      ctx.stroke();
      hatchPoly([[lv.island.x-22,H],[lv.island.x-10,lv.island.y],[lv.island.x+10,lv.island.y],[lv.island.x+22,H]]);
    }
  }

  function hatchFill(x1,y1,x2,y2){
    ctx.save();
    ctx.beginPath();
    ctx.rect(x1,y1,x2-x1,y2-y1);
    ctx.clip();
    ctx.strokeStyle = 'rgba(95,212,255,0.15)';
    ctx.lineWidth = 1;
    for(let x=x1-  (y2-y1); x<x2; x+=10){
      ctx.beginPath();
      ctx.moveTo(x, y1);
      ctx.lineTo(x+(y2-y1), y2);
      ctx.stroke();
    }
    ctx.restore();
  }
  function hatchPoly(pts){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.closePath();
    ctx.clip();
    const minX = Math.min(...pts.map(p=>p[0])) - 60;
    const maxX = Math.max(...pts.map(p=>p[0])) + 60;
    const minY = Math.min(...pts.map(p=>p[1]));
    const maxY = Math.max(...pts.map(p=>p[1]));
    ctx.strokeStyle = 'rgba(95,212,255,0.18)';
    for(let x=minX; x<maxX; x+=9){
      ctx.beginPath();
      ctx.moveTo(x, minY);
      ctx.lineTo(x+(maxY-minY), maxY);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawEdges(){
    for(const e of state.edges){
      const mat = MATERIAL[e.material];
      const d = dist(e.a,e.b);
      const stretch = Math.abs((d-e.rest)/e.rest);
      const strain = Math.min(1, stretch / mat.breakStretch);
      ctx.lineWidth = mat.width;
      ctx.strokeStyle = mat.dark;
      ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y); ctx.stroke();
      ctx.lineWidth = mat.width - 2.5;
      // color shifts toward red as strain increases
      const c = lerpColor(mat.color, '#ff5f6d', strain*0.85);
      ctx.strokeStyle = c;
      ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y); ctx.stroke();
    }
  }
  function lerpColor(c1,c2,t){
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(a.r+(b.r-a.r)*t);
    const g = Math.round(a.g+(b.g-a.g)*t);
    const bb = Math.round(a.b+(b.b-a.b)*t);
    return `rgb(${r},${g},${bb})`;
  }
  function hexToRgb(h){
    h = h.replace('#','');
    return { r:parseInt(h.substring(0,2),16), g:parseInt(h.substring(2,4),16), b:parseInt(h.substring(4,6),16) };
  }

  function drawNodes(){
    for(const n of state.nodes){
      if(n.pinned){
        ctx.fillStyle = '#5fd4ff';
        ctx.strokeStyle = '#0c2338';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.rect(n.x-7,n.y-7,14,14); ctx.fill(); ctx.stroke();
      } else if(n.isDeck){
        ctx.fillStyle = '#ff7a45';
        ctx.strokeStyle = '#6e2f0f';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.rect(n.x-6,n.y-6,12,12); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = '#9fb4c2';
        ctx.strokeStyle = '#3a4b56';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(n.x,n.y,6,0,Math.PI*2); ctx.fill(); ctx.stroke();
      }
    }
    // highlight pending node
    if(state.pendingNode){
      const n = state.pendingNode;
      ctx.strokeStyle = '#5fe3a0';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x,n.y,12,0,Math.PI*2); ctx.stroke();
    }
  }

  function drawVehicle(){
    const v = state.vehicle;
    if(!v) return;
    ctx.save();
    ctx.translate(v.x, v.y);
    // body
    ctx.fillStyle = '#ff7a45';
    ctx.strokeStyle = '#3a1a08';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-18,-14,36,16,2) : ctx.rect(-18,-14,36,16);
    ctx.fill(); ctx.stroke();
    // cab
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-8,-24,16,12,2) : ctx.rect(-8,-24,16,12);
    ctx.fill(); ctx.stroke();
    // wheels
    ctx.fillStyle = '#12222c';
    ctx.beginPath(); ctx.arc(-11,4,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11,4,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBreakFx(){
    for(const f of state.breakFx){
      const a = Math.max(0, f.life/0.35);
      ctx.strokeStyle = `rgba(255,95,109,${a})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const ang = (i/5)*Math.PI*2 + f.life*10;
        const r = 6 + (1-a)*18;
        ctx.moveTo(f.x, f.y);
        ctx.lineTo(f.x+Math.cos(ang)*r, f.y+Math.sin(ang)*r);
      }
      ctx.stroke();
    }
  }

  function draw(){
    drawGrid();
    drawTerrain();
    drawEdges();
    drawNodes();
    drawBreakFx();
    drawVehicle();
  }

  // ---------- Main loop ----------
  let lastT = performance.now();
  function loop(t){
    const dt = Math.min(0.032, (t-lastT)/1000);
    lastT = t;
    if(state.simulating){
      physicsStep(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  function canvasPos(evt){
    const rect = canvas.getBoundingClientRect();
    const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
    return { x: cx * (W/rect.width), y: cy * (H/rect.height) };
  }

  canvas.addEventListener('pointerdown', (e)=>{
    if(state.simulating) return;
    const p = canvasPos(e);
    if(state.tool==='deck'){
      tryAddNode(p.x, p.y, true);
    } else if(state.tool==='support'){
      tryAddNode(p.x, p.y, false);
    } else if(state.tool==='beam'){
      const n = nodeAt(p.x,p.y,18);
      if(!n){ flash('CLICK AN EXISTING JOINT'); return; }
      if(!state.pendingNode){
        state.pendingNode = n;
      } else {
        if(state.pendingNode !== n){ tryAddEdge(state.pendingNode, n); }
        state.pendingNode = null;
      }
    } else if(state.tool==='delete'){
      deleteNear(p.x,p.y);
    }
  });

  function setTool(tool){
    state.tool = tool;
    state.pendingNode = null;
    ['toolDeck','toolSupport','toolBeam','toolDelete'].forEach(id=>document.getElementById(id).classList.remove('active'));
    const map = { deck:'toolDeck', support:'toolSupport', beam:'toolBeam', delete:'toolDelete' };
    document.getElementById(map[tool]).classList.add('active');
  }
  document.getElementById('toolDeck').onclick = ()=>setTool('deck');
  document.getElementById('toolSupport').onclick = ()=>setTool('support');
  document.getElementById('toolBeam').onclick = ()=>setTool('beam');
  document.getElementById('toolDelete').onclick = ()=>setTool('delete');

  document.getElementById('matWood').onclick = ()=>{
    state.material='wood';
    document.getElementById('matWood').classList.add('active');
    document.getElementById('matSteel').classList.remove('active');
  };
  document.getElementById('matSteel').onclick = ()=>{
    state.material='steel';
    document.getElementById('matSteel').classList.add('active');
    document.getElementById('matWood').classList.remove('active');
  };

  document.getElementById('clearAll').onclick = clearAll;
  document.getElementById('resetBtn').onclick = resetBuild;
  document.getElementById('buildBtn').onclick = ()=>{
    if(state.simulating) return;
    startSimulation();
  };

  // ---------- Init ----------
  loadLevel(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
