<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Story — Team Life Simulation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --ink:#16241F;
    --ink-soft:#3B4F48;
    --parchment:#FBF7EE;
    --parchment-dim:#F1EAD9;
    --forest:#1F4B43;
    --forest-dark:#163732;
    --marigold:#F2A93B;
    --marigold-dark:#C9860F;
    --coral:#E8654F;
    --sky:#4C93A6;
    --violet:#7C6FE0;
    --line:#D8CDAF;
    --white:#FFFFFF;

    --stat-knowledge:#7C6FE0;
    --stat-happiness:#F2A93B;
    --stat-friendship:#4C93A6;
    --stat-money:#3F9463;
    --stat-health:#E8654F;

    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:8px;
    --shadow-card: 0 6px 0 var(--line), 0 10px 24px rgba(22,36,31,0.12);
    --shadow-btn: 0 4px 0 rgba(0,0,0,0.18);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(242,169,59,0.10), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(76,147,166,0.14), transparent 45%),
      var(--parchment);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:clamp(16px,1.6vw,19px);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',system-ui,sans-serif;
    font-weight:700;
    letter-spacing:0.2px;
  }
  .mono{ font-family:'Space Mono', monospace; }

  button{ font-family:inherit; cursor:pointer; }
  button,.pill,.choice-label,.choice-blurb,.p-name,.p-desc,.tm-btn,.badge{
    min-width:0; max-width:100%; overflow-wrap:anywhere; word-break:normal;
  }
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline: 3px solid var(--forest);
    outline-offset: 3px;
  }
  a{color:inherit;}

  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px clamp(14px,3vw,32px);
    background:var(--forest);
    color:var(--parchment);
    box-shadow:0 3px 0 var(--forest-dark);
    position:relative; z-index:20;
    flex-wrap:wrap; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:1.15rem; }
  .brand .dot{ width:12px;height:12px;border-radius:50%;background:var(--marigold); }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .lang-toggle{
    display:inline-flex; align-items:center; gap:5px; min-height:42px;
    padding:5px; border:1px solid rgba(255,255,255,0.28); border-radius:999px;
    background:rgba(255,255,255,0.1); color:var(--parchment);
  }
  .lang-toggle span{ padding:4px 8px; border-radius:999px; font-size:0.78rem; font-weight:800; }
  .lang-toggle .active{ background:var(--marigold); color:var(--forest-dark); }

  .pill{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:999px;
    padding:7px 14px;
    font-size:0.9rem;
    display:flex; align-items:center; gap:8px;
    color:var(--parchment);
  }

  .icon-btn{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--parchment);
    border-radius:999px;
    min-height:44px; min-width:44px;
    padding:8px 16px;
    font-weight:700;
    font-size:0.95rem;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s ease, background .12s ease;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.22); transform:translateY(-1px); }

  /* ---------- LIFE PATH (signature element) ---------- */
  .lifepath-wrap{
    background:var(--forest-dark);
    padding:10px clamp(14px,3vw,32px) 16px;
    overflow-x:auto;
  }
  .lifepath{
    display:flex; align-items:center;
    min-width:max-content;
    gap:0;
  }
  .lp-node{
    display:flex; flex-direction:column; align-items:center;
    width:64px; flex-shrink:0; position:relative;
  }
  .lp-dot{
    width:16px; height:16px; border-radius:50%;
    background:rgba(255,255,255,0.25);
    border:2px solid rgba(255,255,255,0.35);
    z-index:2;
  }
  .lp-node.done .lp-dot{ background:var(--marigold); border-color:var(--marigold); }
  .lp-node.current .lp-dot{
    background:var(--parchment); border-color:var(--parchment);
    width:22px; height:22px;
    box-shadow:0 0 0 5px rgba(242,169,59,0.35);
  }
  .lp-age{ margin-top:6px; font-size:0.72rem; color:rgba(255,255,255,0.7); font-family:'Space Mono',monospace; }
  .lp-line{
    height:3px; flex:1; background:rgba(255,255,255,0.2); min-width:20px;
  }
  .lp-line.done{ background:var(--marigold); }

  /* ---------- MAIN ---------- */
  main{ flex:1; display:flex; flex-direction:column; align-items:center; padding:clamp(16px,4vw,40px); }
  .stage{ width:100%; max-width:920px; margin:0 auto; }

  .eyebrow{
    font-family:'Space Mono',monospace;
    text-transform:uppercase; letter-spacing:2px;
    font-size:0.78rem; color:var(--forest);
    background:rgba(31,75,67,0.08);
    display:inline-block; padding:5px 12px; border-radius:999px;
    margin-bottom:10px;
  }

  /* ---------- WELCOME ---------- */
  .welcome{ text-align:center; padding:clamp(20px,6vw,60px) 10px; }
  .welcome .big-title{
    font-size:clamp(2.2rem,6vw,4rem);
    line-height:1.05; margin:8px 0 6px;
    color:var(--forest);
  }
  .welcome .big-title span{ color:var(--marigold-dark); }
  .welcome p.sub{ font-size:1.15rem; color:var(--ink-soft); max-width:560px; margin:0 auto 30px; }
  .welcome-art{ font-size:3.2rem; margin-bottom:6px; letter-spacing:14px; }

  .btn{
    font-weight:800; border:none; border-radius:999px;
    padding:16px 34px; font-size:1.05rem;
    min-height:56px;
    box-shadow:var(--shadow-btn);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.18); }
  .btn-primary{ background:var(--marigold); color:var(--forest-dark); }
  .btn-primary:hover{ background:#f7b854; }
  .btn-secondary{ background:var(--forest); color:var(--parchment); }
  .btn-secondary:hover{ background:#245b51; }
  .btn-ghost{ background:transparent; color:var(--forest); border:2px solid var(--forest); box-shadow:none; padding:14px 30px; }
  .btn-ghost:active{ transform:none; }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; box-shadow:none; transform:none; }

  /* ---------- CARD ---------- */
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:clamp(18px,4vw,34px);
  }

  /* ---------- INSTRUCTIONS PANEL ---------- */
  .whatnow{
    background:var(--parchment-dim);
    border:2px dashed var(--marigold-dark);
    border-radius:var(--radius-md);
    margin-bottom:18px;
    overflow:hidden;
  }
  .whatnow summary{
    list-style:none; cursor:pointer;
    padding:12px 16px;
    display:flex; align-items:center; gap:10px;
    font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--forest-dark);
    min-height:44px;
  }
  .whatnow summary::-webkit-details-marker{ display:none; }
  .whatnow summary .car{ margin-left:auto; transition:transform .15s ease; }
  .whatnow[open] summary .car{ transform:rotate(90deg); }
  .whatnow .body{ padding:0 16px 14px 16px; color:var(--ink-soft); line-height:1.55; }

  /* ---------- CHARACTER CREATION ---------- */
  .field{ margin-bottom:22px; }
  .field label{ display:block; font-weight:800; margin-bottom:8px; font-size:1rem; color:var(--forest-dark); }
  .field input[type=text]{
    width:100%; padding:14px 16px; font-size:1.05rem;
    border:2px solid var(--line); border-radius:var(--radius-sm);
    background:var(--parchment); color:var(--ink);
    min-height:52px;
  }
  .field input[type=text]:focus{ border-color:var(--forest); }

  .choice-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px; }
  .avatar-btn{
    background:var(--parchment); border:2.5px solid var(--line); border-radius:var(--radius-md);
    font-size:2rem; padding:12px 0; min-height:64px;
    display:flex; align-items:center; justify-content:center;
  }
  .avatar-btn.sel{ border-color:var(--marigold-dark); background:#FCEBC8; box-shadow:0 0 0 3px rgba(242,169,59,0.35); }

  /* ---------- CAMERA / CHARACTER PHOTO ---------- */
  .photo-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .photo-tab{
    flex:1; background:var(--parchment); border:2px solid var(--line); border-radius:999px;
    padding:10px 14px; font-weight:700; min-height:44px;
  }
  .photo-tab.sel{ background:var(--forest); color:var(--parchment); border-color:var(--forest); }

  .camera-box{
    background:var(--forest-dark); border-radius:var(--radius-md); padding:16px;
    text-align:center; color:var(--parchment);
  }
  .camera-video, .camera-canvas-preview{
    width:100%; max-width:340px; aspect-ratio:1/1; object-fit:cover;
    border-radius:var(--radius-md); background:#000; border:3px solid var(--marigold);
    margin:0 auto 14px; display:block;
  }
  .camera-preview-img{
    width:180px; height:180px; object-fit:cover; border-radius:50%;
    border:4px solid var(--marigold); margin:0 auto 14px; display:block;
  }
  .camera-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .camera-note{ font-size:0.8rem; color:rgba(255,255,255,0.7); margin-top:10px; }
  .camera-error{
    background:rgba(232,101,79,0.18); border:1px solid var(--coral); color:#FBEAE6;
    border-radius:var(--radius-sm); padding:10px 14px; font-size:0.88rem; margin-bottom:12px;
  }
  .char-avatar-img{ border-radius:50%; object-fit:cover; display:inline-block; vertical-align:middle; border:2px solid var(--marigold); }

  .pers-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .pers-btn{
    text-align:left; background:var(--parchment); border:2.5px solid var(--line);
    border-radius:var(--radius-md); padding:14px; min-height:88px;
  }
  .pers-btn .p-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem; display:flex; gap:8px; align-items:center; color:var(--forest-dark); }
  .pers-btn .p-desc{ font-size:0.85rem; color:var(--ink-soft); margin-top:4px; }
  .pers-btn.sel{ border-color:var(--forest); background:#E4EFEC; box-shadow:0 0 0 3px rgba(31,75,67,0.2); }

  /* ---------- STATS BAR ---------- */
  .statsbar{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px; margin-bottom:18px;
  }
  .statchip{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .statchip .s-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); }
  .statchip .s-val{ font-family:'Space Mono',monospace; font-weight:700; }
  .statchip .s-bar{ height:8px; border-radius:999px; background:var(--parchment-dim); margin-top:6px; overflow:hidden; }
  .statchip .s-fill{ height:100%; border-radius:999px; transition:width .4s ease; }

  /* ---------- EVENT ---------- */
  .event-meta{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .age-badge{
    font-family:'Space Mono',monospace; background:var(--forest); color:var(--parchment);
    padding:8px 14px; border-radius:var(--radius-sm); font-weight:700; font-size:1rem;
  }
  .stage-badge{
    background:var(--marigold); color:var(--forest-dark); font-weight:800;
    padding:8px 14px; border-radius:var(--radius-sm); font-size:0.92rem;
  }
  .story-title{ font-size:clamp(1.5rem,3vw,2rem); margin:6px 0 10px; color:var(--forest-dark); }
  .story-text{ font-size:1.08rem; line-height:1.6; color:var(--ink); margin-bottom:20px; }

  .discuss-callout{
    background:#EAF3F1; border-left:5px solid var(--sky);
    border-radius:var(--radius-sm); padding:12px 16px; margin-bottom:20px;
    font-size:0.95rem; color:var(--forest-dark); display:flex; gap:10px; align-items:flex-start;
  }

  .choices{ display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:720px){ .choices{ grid-template-columns:1fr 1fr; } }
  .choice-card{
    background:var(--parchment); border:2.5px solid var(--line); border-radius:var(--radius-md);
    padding:16px 18px; text-align:left; display:flex; flex-direction:column; gap:8px;
    min-height:80px;
  }
  .choice-card:hover{ border-color:var(--forest); }
  .choice-label{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem; color:var(--forest-dark); }
  .choice-blurb{ font-size:0.9rem; color:var(--ink-soft); }
  .choice-deltas{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .delta-tag{
    font-family:'Space Mono',monospace; font-size:0.78rem; font-weight:700;
    padding:3px 9px; border-radius:999px;
  }
  .delta-pos{ background:#E3F3E7; color:#276B44; }
  .delta-neg{ background:#FBE7E2; color:#B23F27; }

  /* ---------- CONFIRM MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(22,36,31,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--white); border-radius:var(--radius-lg); padding:30px; max-width:460px; width:100%;
    text-align:center; box-shadow:var(--shadow-card);
  }
  .modal h3{ color:var(--forest-dark); font-size:1.4rem; margin-top:0; }
  .modal .modal-actions{ display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap; }

  /* ---------- DECISION CONSEQUENCES ---------- */
  .consequence-card{ text-align:center; }
  .consequence-icon{ font-size:3.4rem; line-height:1; margin-bottom:10px; }
  .consequence-message{
    max-width:700px; margin:14px auto 22px; padding:16px 18px;
    background:#FBE7E2; border-left:5px solid var(--coral); border-radius:var(--radius-sm);
    color:var(--ink); line-height:1.65; text-align:left;
  }
  .consequence-actions{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:22px; }

  /* ---------- DECISION TREE + AI LEARNING ---------- */
  .learning-card{
    background:#EAF3F1; border:2px solid var(--sky); border-radius:var(--radius-md);
    margin:18px auto; text-align:left; overflow:hidden; max-width:920px;
  }
  .learning-card summary{
    list-style:none; cursor:pointer; padding:14px 16px; min-height:48px;
    display:flex; align-items:center; gap:10px; color:var(--forest-dark);
    font-family:'Baloo 2',sans-serif; font-weight:700;
  }
  .learning-card summary::-webkit-details-marker{ display:none; }
  .learning-card summary .car{ margin-left:auto; transition:transform .15s ease; flex-shrink:0; }
  .learning-card[open] summary .car{ transform:rotate(90deg); }
  .learning-body{ padding:0 16px 16px; color:var(--ink-soft); line-height:1.65; }
  .decision-flow{
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px;
    margin:16px 0;
  }
  .flow-step{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:10px 8px; text-align:center; font-size:0.82rem; color:var(--forest-dark);
  }
  .flow-step strong{ display:block; margin-bottom:3px; }
  .ai-lens{
    background:#F2EFFD; border-left:5px solid var(--violet); border-radius:var(--radius-sm);
    padding:12px 16px; margin-bottom:20px; color:var(--ink-soft); font-size:0.9rem;
  }
  .ai-lens strong{ color:var(--forest-dark); }

  /* ---------- TIMER ---------- */
  .timer-banner{
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:var(--forest-dark); color:var(--parchment); border-radius:var(--radius-sm);
    padding:10px 16px; margin-bottom:18px; font-family:'Space Mono',monospace; font-size:1.1rem;
  }
  .timer-banner.done{ background:var(--coral); }
  .timer-banner .tclock{ font-weight:700; font-size:1.3rem; }

  /* ---------- REFLECTION ---------- */
  .refl-q{ margin-bottom:22px; }
  .refl-q .qtext{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.1rem; color:var(--forest-dark); margin-bottom:8px; }
  .refl-q textarea{
    width:100%; min-height:90px; padding:12px 14px; border:2px solid var(--line);
    border-radius:var(--radius-sm); font-family:inherit; font-size:1rem; background:var(--parchment); color:var(--ink);
    resize:vertical;
  }

  /* ---------- PRESENTATION ---------- */
  .present-header{ text-align:center; margin-bottom:26px; }
  .present-avatar{ font-size:4rem; }
  .present-name{ font-size:clamp(1.8rem,4vw,2.6rem); color:var(--forest-dark); margin:6px 0 2px; }
  .present-sub{ color:var(--ink-soft); font-size:1.05rem; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px){ .grid2{ grid-template-columns:1fr; } }

  .panel{
    background:var(--parchment-dim); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:16px;
  }
  .panel h4{ margin:0 0 10px; font-family:'Baloo 2',sans-serif; color:var(--forest-dark); font-size:1.05rem; }
  .panel ul{ margin:0; padding-left:20px; line-height:1.7; }
  .timeline-item{ display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:0.92rem; }
  .timeline-item:last-child{ border-bottom:none; }
  .timeline-item .t-age{ font-family:'Space Mono',monospace; font-weight:700; color:var(--forest); width:44px; flex-shrink:0; }

  .badge-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge{ background:var(--marigold); color:var(--forest-dark); font-weight:800; font-size:0.85rem; padding:6px 12px; border-radius:999px; }

  .lesson-box{
    background:var(--forest); color:var(--parchment); border-radius:var(--radius-lg);
    padding:24px; text-align:center; margin-top:10px; font-size:1.1rem; line-height:1.6;
  }
  .lesson-box .lb-title{ font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:2px; font-size:0.78rem; color:var(--marigold); margin-bottom:10px; }

  .present-mode-btn{ display:block; margin:26px auto 0; }

  /* ---------- ACTION ROW ---------- */
  .action-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:12px; flex-wrap:wrap; }

  /* ---------- TEACHER MENU ---------- */
  .teacher-fab{
    position:fixed; bottom:20px; right:20px; z-index:40;
    background:var(--forest-dark); color:var(--parchment); border:none; border-radius:999px;
    min-height:56px; min-width:56px; padding:0 20px; font-weight:800; display:flex; align-items:center; gap:8px;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
  }
  .teacher-panel{
    position:fixed; bottom:86px; right:20px; z-index:41; background:var(--white); border:1px solid var(--line);
    border-radius:var(--radius-md); box-shadow:var(--shadow-card); padding:16px; width:min(280px,86vw);
  }
  .teacher-panel h4{ margin:0 0 10px; font-family:'Baloo 2',sans-serif; color:var(--forest-dark); }
  .tm-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .tm-btn{
    background:var(--parchment); border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:0.88rem; font-weight:700; color:var(--ink); flex:1; min-height:40px;
  }
  .tm-btn:hover{ border-color:var(--forest); }
  .tm-select{ padding:8px; border-radius:var(--radius-sm); border:1.5px solid var(--line); font-family:inherit; width:100%; margin-bottom:8px; }

  .hidden-ui .teacher-fab, .hidden-ui .teacher-panel, .hidden-ui .topbar-right .icon-btn{ display:none !important; }

  footer.msg{
    text-align:center; padding:30px 16px; color:var(--ink-soft); font-size:0.85rem;
  }

  /* ---------- PRINT ---------- */
  @media print{
    body{ background:white !important; }
    .topbar, .lifepath-wrap, .teacher-fab, .teacher-panel, .no-print{ display:none !important; }
    .card{ box-shadow:none; border:1px solid #999; }
    main{ padding:0; }
    .report-page{ width:190mm; margin:0 auto; }
  }

  .sr-only{ position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap; }

  @media (max-width:560px){
    .topbar{ align-items:flex-start; }
    .topbar-right{ width:100%; gap:7px; }

}

  'A local shop offers you a part-time job after school. It pays well but eats into your free evenings.':'Một cửa hàng gần nhà mời bạn làm thêm sau giờ học. Thu nhập khá tốt nhưng sẽ chiếm phần lớn thời gian rảnh buổi tối.',

function pickRandom(arr,n){
  const copy=[...arr]; const out=[];
  while(out.length<n && copy.length){ out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]); }
  return out;
}
function clamp(n){ return Math.max(0, Math.min(100, n)); }

/* Simple sound (WebAudio, no assets needed) */
let audioCtx=null;
function beep(freq=520, dur=0.09){
  if(!state.soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* ============================= TIMER LOGIC ============================= */
function startTimer(){
  clearInterval(state.timerInterval);
  if(state.timerOption==='none'){ state.timerRemaining=0; state.timerRunning=false; state.timerDone=false; return; }
  state.timerTotal = parseInt(state.timerOption,10)*60;
  state.timerRemaining = state.timerTotal;
  state.timerRunning = true;
  state.timerDone = false;
  state.timerInterval = setInterval(()=>{
    if(!state.timerRunning) return;
    state.timerRemaining--;
    if(state.timerRemaining<=0){
      state.timerRemaining=0; state.timerRunning=false; state.timerDone=true;
      clearInterval(state.timerInterval);
      beep(700,0.15);
    }
    renderTimerOnly();
  },1000);
}
function renderTimerOnly(){
  const holder=document.getElementById('timerHolder');
  if(holder) holder.innerHTML = timerBannerHTML();
}

async function startCamera(){
  state.cameraError='';
  stopCamera();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    state.cameraStream = stream;
    render();
    const video = document.getElementById('cameraVideo');
    if(video){ video.srcObject = stream; }
  }catch(err){
    state.cameraError = t('cameraError');
    render();
  }
}
function stopCamera(){
  if(state.cameraStream){
    state.cameraStream.getTracks().forEach(t=>t.stop());
    state.cameraStream=null;
  }
}
function capturePhoto(){
  const video = document.getElementById('cameraVideo');
  if(!video) return;
  const size = Math.min(video.videoWidth, video.videoHeight) || 480;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const sx = (video.videoWidth - size)/2, sy = (video.videoHeight - size)/2;
  ctx.translate(size,0); ctx.scale(-1,1); // mirror for a natural selfie view
  ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
  state.avatarPhoto = canvas.toDataURL('image/png');
  stopCamera();
  beep(700,0.1);
  render();
}
function retakePhoto(){
  state.avatarPhoto=null;
  startCamera();
}

function computeEnding(){
  const sorted = [...STATS].sort((a,b)=>state.stats[b]-state.stats[a]);
  const top2 = STATS.filter(s=>s===sorted[0] || s===sorted[1]);
  const career = CAREER_MAP[top2.join('|')] || { title:t('roundedCareer'), desc:t('roundedCareerDesc') };

  const achievements = [];
  STATS.forEach(s=>{
    if(state.stats[s]>=75) achievements.push(t('champion',{icon:STAT_META[s].icon,stat:statLabel(s)}));
  });
  if(achievements.length===0) achievements.push(t('balancedBadge'));

  let best=null, worst=null, biggest=null;
  state.timeline.forEach(t=>{
    Object.entries(t.deltas).forEach(([stat,v])=>{
      if(best===null || v>best.v) best={ ...t, stat, v };
      if(worst===null || v<worst.v) worst={ ...t, stat, v };
    });
    const mag = Object.values(t.deltas).reduce((a,b)=>a+Math.abs(b),0);
    if(biggest===null || mag>biggest.mag) biggest={ ...t, mag };
  });

  const fallback = biggest || state.timeline[0] || { age:'—', title:'—', choiceLabel:'—', deltas:{} };
  if(best===null) best={ ...fallback, stat:sorted[0], v:0 };
  if(worst===null) worst={ ...fallback, stat:sorted[0], v:0 };
  if(biggest===null) biggest={ ...fallback, mag:0 };

  const lesson = state.lang==='vi' ? LESSONS_VI[sorted[0]] : LESSONS[sorted[0]];
  return { career, achievements, best, worst, biggest, topStat:sorted[0], sorted };
}

          <h4>⛰️ ${t('greatestChallenge')}</h4>
          <p style="margin:0;">${t('challengeSentence',{age:end.worst.age,choice:esc(dt(end.worst.choiceLabel)),title:esc(dt(end.worst.title)),stat:statLabel(end.worst.stat),value:end.worst.v})}</p>
        </div>
      </div>

      <div class="panel">
        <h4>🔑 ${t('importantDecision')}</h4>
        <p style="margin:0;">${t('importantSentence',{age:end.biggest.age,title:esc(dt(end.biggest.title)),char:esc(state.charName)})}</p>
      </div>

      <div class="panel">
        <h4>💬 ${t('teamReflection')}</h4>
        <ul>${state.reflectionQs.map((q,i)=>`<li><strong>${esc(dt(q))}</strong><br>${esc(state.reflectionAnswers[i]||t('noAnswer'))}</li>`).join('')}</ul>
      </div>

      ${decisionLearningHTML(false)}

      <div class="lesson-box">
        <div class="lb-title">${t('oneLifeLesson')}</div>
        ${esc(end.lesson)}
      </div>

      <p style="text-align:center;color:var(--ink-soft);line-height:1.6;margin-top:26px;font-size:0.98rem;">
        ${t('finalMessage')}
      </p>

      ${!state.presentMode ? `<div style="text-align:center;">
        <button class="btn btn-secondary present-mode-btn" id="enterPresentMode">${t('presentMode')}</button>
        <button class="btn btn-ghost" id="toReportBtn" style="margin-top:14px;">${t('printableReport')}</button>
      </div>` : `<div style="text-align:center;margin-top:20px;">
        <button class="btn btn-ghost" id="exitPresentMode">${t('exitPresent')}</button>
      </div>`}
    </div>
  </div>`;
}

function renderReport(){
  const end = computeEnding();
  return `
  <div class="stage no-print" style="margin-bottom:16px;">
    <button class="btn btn-ghost" id="backToPresentBtn">${t('backPresentation')}</button>
    <button class="btn btn-primary" id="printBtn" style="margin-left:10px;">${t('printStory')}</button>
  </div>
  <div class="stage report-page">
    <div class="card">
      <div style="text-align:center;margin-bottom:16px;">
        <div>${avatarDisplay('3.2rem')}</div>
        <h1 style="color:var(--forest-dark);margin:6px 0 2px;">${esc(state.charName)}</h1>
        <div style="color:var(--ink-soft);">${t('team')} ${esc(state.teamName)} &middot; ${esc(dt(end.career.title))}</div>
      </div>
      <div class="panel"><h4>🧭 ${t('timeline')}</h4>
        ${state.timeline.map(item=>`<div class="timeline-item"><span class="t-age">${t('age')} ${item.age}</span><span>${esc(dt(item.title))}: “${esc(dt(item.choiceLabel))}”</span></div>`).join('')}
      </div>
      <div class="panel"><h4>🏅 ${t('achievements')}</h4><div class="badge-row">${end.achievements.map(a=>`<span class="badge">${esc(a)}</span>`).join('')}</div></div>
      <div class="panel"><h4>📊 ${t('lifeStats')}</h4>${statsBarHTML()}</div>
      <div class="panel"><h4>🔑 ${t('importantChoices')}</h4>
        <p style="margin:0 0 8px;"><strong>${t('greatestSuccess')}:</strong> ${t('age')} ${end.best.age} — “${esc(dt(end.best.choiceLabel))}”</p>
        <p style="margin:0;"><strong>${t('greatestChallenge')}:</strong> ${t('age')} ${end.worst.age} — “${esc(dt(end.worst.choiceLabel))}”</p>
      </div>
      <div class="panel"><h4>💬 ${t('reflectionQuestions')}</h4>
        <ul>${state.reflectionQs.map((q,i)=>`<li><strong>${esc(dt(q))}</strong> ${esc(state.reflectionAnswers[i]||'—')}</li>`).join('')}</ul>
      </div>
      <div class="lesson-box"><div class="lb-title">${t('finalLesson')}</div>${esc(end.lesson)}</div>
    </div>
  </div>`;
}

/* ============================= TEACHER MENU ============================= */
function teacherMenuHTML(){
  if(!state.teacherOpen) return `<button class="teacher-fab" id="teacherFab">🧑‍🏫 ${t('teacherMenu')}</button>`;
  return `
  <button class="teacher-fab" id="teacherFab">🧑‍🏫 ${t('close')}</button>
  <div class="teacher-panel">
    <h4>${t('teacherMenu')}</h4>
    ${timerControlsHTML()}
    <div class="tm-row"><button class="tm-btn" id="tmSkip">${t('skipEvent')}</button><button class="tm-btn" id="tmNext">${t('nextEvent')}</button></div>
    <div class="tm-row"><button class="tm-btn" id="tmPause">${state.timerRunning?t('pauseTimer'):t('resumeTimer')}</button><button class="tm-btn" id="tmSummary">${t('showSummary')}</button></div>
    <div class="tm-row"><button class="tm-btn" id="tmRestart">${t('restartLife')}</button><button class="tm-btn" id="tmSound">${state.soundOn?t('soundOn'):t('soundOff')}</button></div>
    <div class="tm-row"><button class="tm-btn" id="tmHide">${t('hideInterface')}</button><button class="tm-btn" id="tmPresent">${t('presentationMode')}</button></div>
  </div>`;
}

/* ============================= MASTER RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  document.documentElement.lang = state.lang;
  document.title = state.lang==='vi' ? 'Câu chuyện cuộc đời — Cây quyết định' : 'Life Story — Team Life Simulation';
  let body='';
  if(state.screen==='welcome') body = renderWelcome();
  else if(state.screen==='create') body = renderCreate();
  else if(state.screen==='lifeIntro') body = renderLifeIntro();
  else if(state.screen==='event') body = renderEvent();
  else if(state.screen==='trapSevere') body = renderSevereTrap();
  else if(state.screen==='storyEnd') body = renderStoryEnd();
  else if(state.screen==='reflection') body = renderReflection();
  else if(state.screen==='presentation') body = renderPresentation();
  else if(state.screen==='report') body = renderReport();

  const showLifepath = ['event'].includes(state.screen);
  const showTeacher = state.screen!=='report';

  app.innerHTML = `
    <div class="topbar no-print">
      <div class="brand"><span class="dot"></span><span>${t('brand')}</span></div>
      <div class="topbar-right">
        <span class="pill">${t('team')}: ${esc(state.teamName)||'—'}</span>
        <span class="pill">${esc(state.charName)? avatarDisplay('1.4rem')+' '+esc(state.charName) : '—'}</span>
        <button class="lang-toggle" id="langToggle" aria-label="${esc(t('language'))}" title="${esc(t('language'))}">
          <span class="${state.lang==='en'?'active':''}">EN</span><span class="${state.lang==='vi'?'active':''}">VI</span>
        </button>
      </div>
    </div>
    ${showLifepath ? lifepathHTML() : ''}
    <main>${body}</main>
    <footer class="msg no-print">${t('footer')}</footer>
    ${state.pendingChoice!==null ? renderConfirmOverlay() : ''}
    ${showTeacher ? teacherMenuHTML() : ''}
  `;
  app.className = state.interfaceHidden ? 'hidden-ui' : '';
  attachHandlers();
}

/* ============================= HANDLERS ============================= */
function attachHandlers(){
  const q = (id)=>document.getElementById(id);

  if(q('langToggle')) q('langToggle').onclick = ()=>{
    state.lang = state.lang==='en' ? 'vi' : 'en';
    render();
  };

  if(q('startBtn')) q('startBtn').onclick = ()=>{ beep(600); state.screen='create'; render(); };

  if(q('teamName')) q('teamName').oninput = e=>{ state.teamName=e.target.value; };
  if(q('charName')) q('charName').oninput = e=>{ state.charName=e.target.value; };
  document.querySelectorAll('[data-avatar]').forEach(b=>{
    b.onclick = ()=>{ state.avatar=b.dataset.avatar; render(); };
  });
  document.querySelectorAll('[data-pers]').forEach(b=>{
    b.onclick = ()=>{ state.personality=b.dataset.pers; render(); };
  });

  if(q('tabPhoto')) q('tabPhoto').onclick = ()=>{ state.avatarType='photo'; render(); };
  if(q('tabIcon')) q('tabIcon').onclick = ()=>{ stopCamera(); state.avatarType='icon'; render(); };
  if(q('startCameraBtn')) q('startCameraBtn').onclick = ()=> startCamera();
  if(q('captureBtn')) q('captureBtn').onclick = ()=> capturePhoto();
  if(q('cancelCameraBtn')) q('cancelCameraBtn').onclick = ()=>{ stopCamera(); render(); };
  if(q('retakeBtn')) q('retakeBtn').onclick = ()=> retakePhoto();
  const camVideo = q('cameraVideo');
  if(camVideo && state.cameraStream && !camVideo.srcObject){ camVideo.srcObject = state.cameraStream; }

  if(q('beginLifeBtn')) q('beginLifeBtn').onclick = ()=>{
    const p = PERSONALITIES.find(p=>p.id===state.personality);
    if(p) state.stats[p.stat] = clamp(state.stats[p.stat]+15);
    stopCamera();
    beep(650); state.screen='lifeIntro'; render();
  };

  if(q('firstEventBtn')) q('firstEventBtn').onclick = ()=>{
    state.eventIndex=0; state.discussionPrompt=pickRandom(DISCUSSION_PROMPTS,1)[0];
    state.screen='event'; startTimer(); render();
  };

  document.querySelectorAll('[data-choice]').forEach(b=>{
    b.onclick = ()=>{ beep(560); state.pendingChoice = parseInt(b.dataset.choice,10); render(); };
  });

  if(q('confirmYes')) q('confirmYes').onclick = ()=> lockInChoice();
  if(q('confirmNo')) q('confirmNo').onclick = ()=>{ state.pendingChoice=null; render(); };
  if(q('continueAfterTrapBtn')) q('continueAfterTrapBtn').onclick = ()=> continueAfterTrap();
  if(q('finishEarlyBtn')) q('finishEarlyBtn').onclick = ()=>{
    clearInterval(state.timerInterval);
    state.screen='reflection';
    render();
  };
  if(q('overrideStoryEndBtn')) q('overrideStoryEndBtn').onclick = ()=> overrideStoryEnd();

  if(q('toPresentationBtn')) q('toPresentationBtn').onclick = ()=>{
    document.querySelectorAll('[data-refl]').forEach(t=>{ state.reflectionAnswers[t.dataset.refl]=t.value; });
    state.screen='presentation'; render();
  };
  document.querySelectorAll('[data-refl]').forEach(t=>{
    t.oninput = e=>{ state.reflectionAnswers[e.target.dataset.refl]=e.target.value; };
  });

  if(q('enterPresentMode')) q('enterPresentMode').onclick = ()=>{ state.presentMode=true; render(); };
  if(q('exitPresentMode')) q('exitPresentMode').onclick = ()=>{ state.presentMode=false; render(); };
  if(q('toReportBtn')) q('toReportBtn').onclick = ()=>{ state.screen='report'; render(); };
  if(q('backToPresentBtn')) q('backToPresentBtn').onclick = ()=>{ state.screen='presentation'; render(); };
  if(q('printBtn')) q('printBtn').onclick = ()=> window.print();

  if(q('timerSelect')) q('timerSelect').onchange = e=>{ state.timerOption=e.target.value; startTimer(); render(); };

  if(q('teacherFab')) q('teacherFab').onclick = ()=>{ state.teacherOpen=!state.teacherOpen; render(); };
  if(q('tmSkip')) q('tmSkip').onclick = ()=> advanceEvent(true);
  if(q('tmNext')) q('tmNext').onclick = ()=> advanceEvent(false);
  if(q('tmPause')) q('tmPause').onclick = ()=>{ state.timerRunning=!state.timerRunning; render(); };
  if(q('tmSummary')) q('tmSummary').onclick = ()=>{ state.screen='presentation'; render(); };
  if(q('tmRestart')) q('tmRestart').onclick = ()=>{ if(confirm(t('restartConfirm'))) restartLife(); };
  if(q('tmSound')) q('tmSound').onclick = ()=>{ state.soundOn=!state.soundOn; render(); };
  if(q('tmHide')) q('tmHide').onclick = ()=>{ state.interfaceHidden=!state.interfaceHidden; render(); };
  if(q('tmPresent')) q('tmPresent').onclick = ()=>{ state.screen='presentation'; state.presentMode=true; render(); };
}

function lockInChoice(){
  const ev = EVENTS[state.eventIndex];
  const choice = ev.choices[state.pendingChoice];
  Object.entries(choice.deltas).forEach(([k,v])=>{ state.stats[k]=clamp(state.stats[k]+v); });
  state.timeline.push({ age:ev.age, title:ev.title, choiceLabel:choice.label, deltas:choice.deltas, trap:choice.trap||null });
  state.pendingChoice=null;

  if(choice.trap==='end'){
    beep(180,0.3);
    state.storyEnded=true;
    state.endReason={ age:ev.age, title:ev.title, choiceLabel:choice.label, message:choice.trapMessage };
    clearInterval(state.timerInterval);
    state.screen='storyEnd';
    render();
    return;
  }
  if(choice.trap==='severe'){
    beep(260,0.25);
    state.activeTrap={ type:'severe', age:ev.age, title:ev.title, choiceLabel:choice.label, message:choice.trapMessage };
    clearInterval(state.timerInterval);
    state.screen='trapSevere';
    render();
    return;
  }
  beep(780,0.12);
  advanceEvent(false);
}

function continueAfterTrap(){
  state.activeTrap=null;
  advanceEvent(false);
}

function overrideStoryEnd(){
  // Teacher override: let the team's life continue despite the trap ending
  state.storyEnded=false;
  state.endReason=null;
  advanceEvent(false);
}

function advanceEvent(isSkip){
  if(isSkip){
    // record a neutral skip in timeline without stat change
    const ev = EVENTS[state.eventIndex];
    state.timeline.push({ age:ev.age, title:ev.title, choiceLabel:'(skipped by teacher)', deltas:{} });
  }
  clearInterval(state.timerInterval);
  state.eventIndex++;
  if(state.eventIndex>=EVENTS.length){
    state.screen='reflection';
  } else {
    state.discussionPrompt = pickRandom(DISCUSSION_PROMPTS,1)[0];
    state.screen='event';
    startTimer();
  }
  render();
}

function restartLife(){
  clearInterval(state.timerInterval);
  stopCamera();
  state = {
    ...state,
    screen:'welcome',
    teamName:'', charName:'', avatar:AVATARS[0], personality:null,
    avatarType:'photo', avatarPhoto:null, cameraStream:null, cameraError:'',
    stats:{ knowledge:50, happiness:50, friendship:50, money:50, health:50 },
    eventIndex:0, pendingChoice:null, timeline:[],
    timerOption:'none', timerTotal:0, timerRemaining:0, timerRunning:false, timerDone:false,
    teacherOpen:false, interfaceHidden:false, presentMode:false,
    reflectionQs: [pickRandom(AI_REFLECTION_QUESTIONS,1)[0], ...pickRandom(REFLECTION_QUESTIONS,2)], reflectionAnswers:{},
    discussionPrompt: pickRandom(DISCUSSION_PROMPTS,1)[0],
    activeTrap:null, storyEnded:false, endReason:null,
  };
  render();
}

render();
</script>
</body>
</html>
